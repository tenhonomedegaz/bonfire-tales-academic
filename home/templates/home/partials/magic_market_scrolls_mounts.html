{% for mount in mounts %}<template id="mount-{{ mount.pk }}-tpl"><article class="mkt-card rarity-comum"><header class="mkt-item-heading"><figure class="mkt-figure"><svg class="market-item-icon" aria-hidden="true"><use href="#magic-stable"></use></svg></figure><div><p class="mkt-card-kind">Estábulos · Montaria</p><h2 class="mkt-card-name">{{ mount.nome }}</h2><span class="market-entry-status">Estoque permanente</span></div></header><div class="mkt-deal"><div><span class="market-unit-label">Preço por unidade</span><span class="mkt-price">{{ mount.preco_display }}</span></div>{% if mercado_ativo and mount.preco_display %}<form method="post" action="{% url 'personagem_comprar_item' mercado_ativo.pk %}" class="mkt-buy" data-shop-buy data-market-unit="{{ mount.preco_ordem }}">{% csrf_token %}<input type="hidden" name="item" value="{{ mount.slug }}"><input type="hidden" name="next" value="{{ mercado_next }}"><label class="market-qty-label"><span>Qtd.</span><input type="number" class="mkt-qty" name="qtd" value="1" min="1" max="99" aria-label="Quantidade de {{ mount.nome }}"></label><button type="submit" class="mkt-btn is-buy" data-nome="{{ mount.nome }}">Comprar</button></form>{% endif %}</div>
{% if mercado_ativo %}<div class="market-buy-summary"><div><span>Total da compra</span><strong data-market-total>{{ mount.preco_display }}</strong></div><p data-market-after></p></div><p class="market-recipient">Para <strong>{{ mercado_ativo.nome }}</strong> · usa o mesmo registro e preço do Mercado Mundano.</p>{% else %}<p class="market-recipient">Entre na conta e selecione uma ficha para comprar.</p>{% endif %}
<div class="bonfire-markdown mkt-desc" data-markdown-source>{{ mount.descricao_markdown|default:'Sem descrição catalogada.'|escape }}</div></article></template>{% endfor %}
{% for scroll in scrolls %}<template id="{{ scroll.id }}-tpl"><article class="mkt-card rarity-{{ scroll.rarity }}"><header class="mkt-item-heading"><figure class="mkt-figure"><svg class="market-item-icon" aria-hidden="true"><use href="#magic-scroll"></use></svg></figure><div><p class="mkt-card-kind">{{ scroll.rarity_label }} · Itens Mágicos</p><h2 class="mkt-card-name">{{ scroll.name }}</h2><p class="magic-english-name">{{ scroll.spell.nome_ingles|default:'' }}</p><span class="market-entry-status">Consulta de catálogo · compra indisponível</span></div></header><div class="mkt-deal"><div><span class="market-unit-label">Preço de referência</span><span class="mkt-price">{{ scroll.price_display }}</span></div></div>
<p class="market-recipient">Preço de referência. Este pergaminho pode ser consultado no catálogo, mas a compra ainda não está aberta.</p>
<p class="magic-customization-note">Quando a compra estiver disponível, o uso ou a transcrição continuará sujeito às regras da magia e da sua classe.</p>{% if scroll.material_sets_price %}<p class="magic-availability-note">O componente consumido eleva o preço para {{ scroll.price_display }}, seguindo o cálculo já usado na Oficina de Magia.</p>{% endif %}
<dl class="mkt-stats"><div><dt>Nível</dt><dd>{{ scroll.level }} · {{ scroll.spell.escola }}</dd></div><div><dt>Alcance</dt><dd>{{ scroll.range_display }}</dd></div><div><dt>CD / Ataque</dt><dd>{{ scroll.save_dc }} / +{{ scroll.attack_bonus }}</dd></div><div><dt>Duração</dt><dd>{{ scroll.spell.duracao }}</dd></div></dl><h3 class="magic-section-title">Magia armazenada</h3><div class="bonfire-markdown mkt-desc" data-markdown-source>{{ scroll.spell.descricao|escape }}</div>{% if scroll.spell.em_niveis_superiores %}<h3 class="magic-section-title">Em níveis superiores</h3><div class="bonfire-markdown mkt-desc" data-markdown-source>{{ scroll.spell.em_niveis_superiores|escape }}</div>{% endif %}
</article></template>{% endfor %}
