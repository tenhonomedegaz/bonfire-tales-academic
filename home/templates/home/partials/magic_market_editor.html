<details class="mkt-inline-editor"><summary>Editar item</summary><form method="post" action="{% url 'wiki_update_magic_item' item.pk %}" data-item-editor>{% csrf_token %}
<label>Nome<input name="nome" value="{{ item.nome }}" required></label><label>Nome em inglês<input name="nome_ingles" value="{{ item.nome_ingles|default:'' }}"></label><label>Slug<input name="slug" value="{{ item.slug }}" required></label>
<label>Raridade<select name="raridade">{% for value,label in raridades_item_magico %}<option value="{{ value }}"{% if item.raridade == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Slot<select name="slot">{% for value,label in slots_item_magico %}<option value="{{ value }}"{% if item.slot == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Tipo<input name="tipo" value="{{ item.tipo|default:'' }}"></label><label>Loja<input name="loja" value="{{ item.loja|default:'' }}"></label><label>Preço em PO<input name="preco" type="number" min="0" step="0.01" value="{{ item.preco|default_if_none:'' }}"></label><label class="mkt-inline-check"><input type="checkbox" name="requer_sintonizacao" value="1"{% if item.requer_sintonizacao %} checked{% endif %}> Exige sintonização</label><label>Detalhes da sintonização<input name="detalhes_sintonizacao" value="{{ item.detalhes_sintonizacao|default:'' }}"></label><label class="is-wide">Imagem<input name="imagem_url" value="{{ item.imagem_url|default:'' }}"></label><label class="is-wide">Descrição<textarea name="descricao_markdown" rows="8">{{ item.descricao_markdown|default:'' }}</textarea></label><label class="is-wide">Tags, uma por linha<textarea name="tags_json" rows="8">{% for tag in item.tags_json %}{{ tag }}{% if not forloop.last %}
{% endif %}{% endfor %}</textarea></label><div class="mkt-inline-actions"><button type="button" class="mkt-btn" data-item-editor-cancel>Cancelar</button><button type="submit" class="mkt-btn is-buy">Salvar item</button><span data-item-editor-status role="status" tabindex="-1" hidden></span></div></form></details>
