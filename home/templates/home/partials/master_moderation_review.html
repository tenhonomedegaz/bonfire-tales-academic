<dialog class="mh-moderation-review" data-master-moderation-dialog aria-labelledby="mh-moderation-title" aria-describedby="mh-moderation-description">
  <h2 id="mh-moderation-title">Revisar decisão</h2>
  <p id="mh-moderation-description" data-master-moderation-description></p>
  <dl>
    <dt>Decisão</dt><dd data-master-moderation-action></dd>
    <dt>Conteúdo</dt><dd data-master-moderation-content></dd>
    <dt data-master-moderation-note-label>Retorno privado</dt><dd data-master-moderation-note></dd>
  </dl>
  <a class="mh-text-link" data-master-moderation-detail target="_blank" rel="noopener noreferrer">Ler conteúdo completo ↗</a>
  <div class="mh-moderation-actions">
    <button type="button" data-master-moderation-cancel>Voltar sem enviar</button>
    <button type="button" data-master-moderation-confirm>Confirmar decisão</button>
  </div>
</dialog>
