<dialog class="mkt-review" data-shop-review aria-labelledby="mkt-review-title" aria-describedby="mkt-review-note">
  <h2 id="mkt-review-title" data-shop-review-title>Revisar negociação</h2>
  <dl>
    <div><dt>Item</dt><dd data-shop-review-item></dd></div>
    <div><dt>Quantidade</dt><dd data-shop-review-quantity></dd></div>
    <div><dt data-shop-review-price-label>Preço por unidade</dt><dd data-shop-review-price></dd></div>
    <div data-shop-review-total-row hidden><dt>Total da compra</dt><dd data-shop-review-total></dd></div>
    <div data-shop-review-base-row hidden><dt>Item-base</dt><dd data-shop-review-base></dd></div>
    <div><dt>Ficha</dt><dd data-shop-review-character></dd></div>
  </dl>
  <p id="mkt-review-note" data-shop-review-note></p>
  <div class="mkt-review-actions">
    <button type="button" data-shop-review-cancel>Voltar</button>
    <button type="button" data-shop-review-confirm>Confirmar</button>
  </div>
</dialog>
