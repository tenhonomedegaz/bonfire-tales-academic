{% extends "home/base.html" %}

{% block title %}Senha Alterada - Bonfire Tales{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-md mx-auto">
    <div class="bg-[var(--bg1)] border border-[var(--stroke)] shadow-2xl p-6 rounded text-center">
      <div class="w-16 h-16 rounded-full bg-[var(--bg1)] border border-[var(--ember)] flex items-center justify-center mx-auto mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-[var(--ember)]">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      
      <h2 class="text-2xl font-rpg font-bold text-[var(--ember)] mb-4 uppercase">Senha Alterada!</h2>
      <p class="text-sm text-[var(--muted)] mb-8">
        Sua senha foi redefinida com sucesso. Agora você já pode acessar sua conta utilizando a nova senha.
      </p>

      <div class="flex justify-center">
        <a href="{% url 'login' %}" class="inline-flex items-center gap-2 text-center rounded-sm bg-gradient-to-r from-[var(--flame)] to-[var(--ember)] px-6 py-2 font-bold text-white shadow-[0_0_15px_rgba(210,23,23,0.3)] hover:shadow-[0_0_20px_rgba(210,23,23,0.6)] hover:brightness-110 transition-all">
          Ir para o Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
