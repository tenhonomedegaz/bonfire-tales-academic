
{% load static %}

        <h3 class="font-rpg text-xl font-bold text-[var(--text)] mb-2">Bonfire Tales RPG</h3>
        <p class="text-sm text-[var(--muted)] max-w-xs">Mundo vivo, missões e RPG via Discord.</p>
      </div>
      
      <div class="flex gap-4">
        <a href="https://discord.gg/eyqe7rj2AX" target="_blank" class="p-2 rounded-full bg-[var(--bg0)] border border-[var(--stroke)] text-[var(--muted)] hover:text-[var(--ember)] hover:border-[var(--ember)] transition-all flex items-center justify-center">

        </a>
        <a href="https://www.youtube.com/@bonfiretalesrpg" target="_blank" class="p-2 rounded-full bg-[var(--bg0)] border border-[var(--stroke)] text-[var(--muted)] hover:text-[var(--ember)] hover:border-[var(--ember)] transition-all flex items-center justify-center">

    </div>
    <div class="container mx-auto px-4 mt-8 pt-8 border-t border-[var(--stroke)] text-center text-xs text-[var(--muted)]">
      <p>© {% now "Y" %} Bonfire Tales RPG. Todos os direitos reservados.</p>
